<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Register - SMADS</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">


</head>

<body class="auth-page">

<div class="auth-container">


<div class="auth-logo">
    SMADS
</div>


<h1>
    Create Account
</h1>


<p class="auth-subtitle">
    Start tracking your digital wellbeing
</p>


{% with messages = get_flashed_messages(
    with_categories=true
) %}

    {% if messages %}

        {% for category, message in messages %}

            <div class="auth-message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}


<form method="POST"
      action="{{ url_for('register') }}">


    <div class="auth-field">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >

    </div>


    <div class="auth-field">

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

    </div>


    <div class="auth-field">

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

    </div>


    <div class="auth-field">

        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Re-enter your password"
            required
        >

    </div>


    <button type="submit"
            class="auth-button">

        Create Account

    </button>


</form>


<p class="auth-bottom">

    Already have an account?

    <a href="{{ url_for('login') }}">
        Login
    </a>

</p>


</div>

</body>

</html>
